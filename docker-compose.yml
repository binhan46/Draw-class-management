services:
  mysql:
    image: mysql:8.0
    container_name: draw_class_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-draw_class_db}
      MYSQL_USER: ${MYSQL_USER:-draw_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-draw_password}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD:-rootpassword} > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Bạn có thể bổ sung các service khác ở đây (ví dụ: redis, mailpit, rabbitmq...)
  # Lệnh `make setup` sẽ tự động khởi chạy mọi service được định nghĩa trong file này.

volumes:
  mysql_data:
    name: draw_class_mysql_data
